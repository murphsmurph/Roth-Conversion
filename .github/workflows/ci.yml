name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Magic-number guard (src/engine)
        run: npm run lint:magic
      - name: Typecheck
        run: npm run typecheck
      - name: Fixture + property suite
        run: npm test

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Magic-number guard (src/engine)
        run: npm run lint:magic
      - name: Typecheck
        run: npm run typecheck
      # The fixture + property suite is RED BY DESIGN until Phase 2 (no engine yet), so it is
      # non-gating for now. Flip continue-on-error off in Phase 2 when 62/62 must pass.
      - name: Fixture + property suite (red-by-design through Phase 1)
        continue-on-error: true
        run: npm test
